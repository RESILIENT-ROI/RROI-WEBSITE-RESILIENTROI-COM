baseURL = 'https://resilientroi.com/'
languageCode = 'en-gb'
title = 'Resilient ROI'
theme = 'hugo-profile'
copyright = '&copy; Resilient ROI Ltd. | London, UK'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true

[params]
  title = 'Resilient ROI'
  description = 'AI Aligned Production Systems'
  favicon = '/favicon/favicon.ico'
  useBootstrapCDN = false
  animate = true

  [params.font]
    fontSize = '1rem'
    fontWeight = 400
    lineHeight = 1.5
    textAlign = 'left'

  [params.navbar]
    align = 'ms-auto'
    brandLogo = '/logo-rroi-64.png'
    brandName = 'Resilient ROI'
    disableSearch = true
    enableSeparator = false
    [params.navbar.stickyNavBar]
      enable = true
      showOnScrollUp = true
    [params.navbar.menus]
      disableAbout = true
      disableExperience = true
      disableEducation = true
      disableProjects = false
      disableAchievements = true
      disableContact = false

  [params.hero]
    enable = true
    intro = ' '
    title = 'Resilient ROI'
    subtitle = 'In the AI Arena'
    content = '''Work is measured by what it returns. We train the whole organisation to cruise at the AI speed.'''
    image = '/rroi-logo-version.png'
    [params.hero.button]
      enable = true
      name = 'What We Do'
      url = '#projects'
      newPage = false
    [params.hero.bottomImage]
      enable = false

  [params.projects]
    enable = true
    title = 'We Navigate'
    [[params.projects.items]]
      title = 'Enablement'
      content = 'Raising your crews maturity, from boarding to following the operating model. The result is a steady stream of AI-enabled products or services, all resilient, safe and compliant.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/cmm/index.html'
    [[params.projects.items]]
      title = 'Preservation'
      content = 'Every mature organization, reaches the point when business value it encapsulates is more valuable than software it has built or uses. Your old systems hold years of business knowledge. We enable your teams to take it out and keep it safe before anything is replaced, so modernisation does not throw it away with the old code.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://iceberg.dbj.org/kb/technical-debt/'
    [[params.projects.items]]
      title = 'Building Blocks'
      content = 'For architecture practices developing a method based on ours. Only the parts of the DBJ Method they need, one chapter at a time. We encapsulated TOGAF so that any specific role distant to architecture sees benefits, not confusion.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/'
    [[params.projects.items]]
      title = 'Assessment'
      content = 'Organizations Key Performance Indicator is the sum of capabilities and maturities of its people. That is the key, for adopters, to enter the new operating model and mitigate the risks at the presence of the AI storm. They learn to decide where their organisation stands today, and what it takes to reach the organization level, where work at AI speeds can safely start. The ROI follows.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/cmm/index.html'
    [[params.projects.items]]
      title = 'Client Feedback'
      content = 'Most customers suffer the technical debt. They quickly spot where Resilient ROI earn their money. Not by demanding poor engineers clear every debt first, but by telling business leaders which debts they can live with, and for how long, which one kills the AI investment, and what it will actually cost to service the rest of the company landscape. — Dusan Jovanovic, Founder'

  [params.contact]
    enable = true
    title = 'Contact'
    content = 'AI does not wait. Write to us.'
    btnName = 'Email'
    btnLink = 'mailto:info@resilientroi.com'

  [params.footer]
    [params.footer.recentPosts]
      enable = false
      path = 'posts'
      count = 3
      title = 'Recent Posts'

  [params.about]
    enable = false
    title = 'We Navigate'
    content = """
The [DBJ Method](https://method.dbj.org/) is not the book of magic.

- **One shared vocabulary**: business, product and technology people speak one language. ([Taxonomy](https://method.dbj.org/taxonomy/index.html))
- **Business declares, technology implements**: Products teams is balancing the race. Business initiates ; technology never surprises. ([Operating model](https://method.dbj.org/bpt/bpt_operating_model.html))
- **Maturity is measured**: Achieved and maintained, before and after the delivery. ([Maturity model](https://method.dbj.org/cmm/index.html))
- **Every decision is recorded**: No ceremony. Short, repeatable cycles, and the reason for each decision. ([The wheel](https://method.dbj.org/adm/index.html))
- **Three quality factors**: Scalability, resilience and compliance. ([3QF](https://dbj.org/3qf-the-key-to-roi/))
- **Human-led**: Architecture decides the structure, flow and boundaries. AI speeds up the delivery.
"""
    [params.about.skills]
      enable = true
      content='With us, no project floats outside the [BPT](https://method.dbj.org/bpt/index.html) loop.'

  [params.terms]
    copyright = 'All rights reserved. Resilient ROI Ltd, London, UK.'
