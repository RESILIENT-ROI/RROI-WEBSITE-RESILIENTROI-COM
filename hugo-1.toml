baseURL = 'https://resilientroi.com/'
languageCode = 'en-gb'
title = 'Resilient ROI'
theme = 'hugo-profile'
copyright = '&copy; Resilient ROI Ltd. | London, UK'

[outputs]
  home = ['HTML', 'RSS', 'JSON']
  page = ['HTML', 'RSS']

[markup.goldmark.renderer]
  unsafe = true

[params]
  title = 'Resilient ROI'
  description = 'Safety at AI Speed, governed by the DBJ Method.'
  favicon = '/favicon/favicon.ico'
  useBootstrapCDN = false
  animate = true

  [params.font]
    fontSize = '1rem'
    fontWeight = 400
    lineHeight = 1.5
    textAlign = 'left'

  [params.navbar]
    align = 'ms-auto'
    brandLogo = '/logo-rroi-64.png'
    brandName = 'Resilient ROI'
    disableSearch = true
    enableSeparator = false
    [params.navbar.stickyNavBar]
      enable = true
      showOnScrollUp = true
    [params.navbar.menus]
      disableAbout = false
      disableExperience = true
      disableEducation = true
      disableProjects = false
      disableAchievements = true
      disableContact = false

  [params.hero]
    enable = true
    intro = 'Governance over Chaos: Products at AI Speed'
    title = 'Resilient ROI'
    subtitle = 'Taking Valuable Legacy Knowledge Into AI-Enabled Products.'
    content = '''
Resilient ROI Ltd runs architecture and delivery projects. Every project is governed by the DBJ Method.\
Work is measured by what it returns. AI or no AI.
'''
    image = '/logo-rroi-256.png'
    [params.hero.button]
      enable = true
      name = 'Explore method.dbj.org'
      url = 'https://method.dbj.org/'
      newPage = true

  [params.about]
    enable = true
    title = 'The DBJ Method'
    content = """
Every Resilient ROI project is run on the DBJ Method ([method.dbj.org](https://method.dbj.org/)). No project runs outside it.

- **One shared vocabulary**: business, product and technology people use the same words for the same things. ([Taxonomy](https://method.dbj.org/taxonomy/index.html))
- **Business declares, technology implements**: business says what the product must be; technology builds exactly that. ([Operating model](https://method.dbj.org/bpt/bpt_operating_model.html))
- **Maturity is measured**: how well the organisation works, from level 0 to 5, before and after. ([Maturity model](https://method.dbj.org/cmm/index.html))
- **Every decision is recorded**: work runs in short, repeatable cycles, and the reason for each decision is written down. ([The wheel](https://method.dbj.org/adm/index.html))
- **Three quality factors**: every product is checked for scalability, resilience and compliance. ([3QF](https://dbj.org/3qf-the-key-to-roi/))
- **Human-led**: AI speeds up the work; experienced people decide structure, data flow and boundaries.
"""
    [params.about.skills]
      enable = false

  [params.projects]
    enable = true
    title = 'What We Do'
    [[params.projects.items]]
      title = 'Organisation Enablement'
      content = 'We train your organisation to work as one crew, boarding the ship safely and following one operating model. The result is a steady stream of AI-enabled products that are resilient, safe and compliant.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/cmm/index.html'
    [[params.projects.items]]
      title = 'Knowledge Preservation'
      content = 'Your old systems hold years of business knowledge. We take it out and keep it safe before anything is replaced, so modernisation does not throw it away with the old code.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://iceberg.dbj.org/kb/technical-debt/'
    [[params.projects.items]]
      title = 'Method Chapters'
      content = 'For architecture practices with a method of their own. Take only the parts of the DBJ Method you need, one chapter at a time, alongside what you already do.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/'
    [[params.projects.items]]
      title = 'Maturity Assessment'
      content = 'Where your organisation stands today, and what it takes to reach the level where AI-enabled product work can safely start. Output: findings and a roadmap.'
      [params.projects.items.featured]
        name = 'Read more'
        link = 'https://method.dbj.org/cmm/index.html'

  [params.contact]
    enable = true
    title = 'Contact'
    content = 'Resilient ROI Ltd, London, UK. For projects and partnerships, write to us.'
    btnName = 'Email'
    btnLink = 'mailto:info@resilientroi.com'

  [params.footer]
    [params.footer.recentPosts]
      enable = true
      path = 'posts'
      count = 3
      title = 'Recent Posts'

  [params.terms]
    copyright = 'All rights reserved. Governed by the DBJ Method.'
